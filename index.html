<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محطة دنيا - لوحة أمين المحطة</title>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    
    <style>
        :root { --bg-color: #1a222e; --card-bg: #2a3545; --primary-orange: #f26f22; --primary-blue: #1c75bc; --text-light: #ffffff; --success-color: #4ade80; --error-color: #e63946; }
        body { background-color: var(--bg-color); color: var(--text-light); font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--primary-blue); padding-bottom: 15px; margin-bottom: 30px; }
        .header h1 { margin: 0; font-size: 24px; color: var(--primary-orange); }
        .btn { padding: 8px 15px; border-radius: 8px; border: none; color: white; font-weight: bold; cursor: pointer; }
        .logout-btn { background: var(--error-color); }
        .meters-container, .settings-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .card { background-color: var(--card-bg); border-radius: 15px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); border-top: 4px solid var(--primary-blue); }
        .card-title { font-size: 20px; margin-bottom: 15px; color: var(--primary-blue); font-weight: bold; border-bottom: 1px solid #444; padding-bottom: 10px; }
        .info-box { background: #1f2a38; padding: 10px; border-radius: 8px; margin-bottom: 15px; font-size: 14px; color: #a0aec0; }
        .info-box span { color: white; font-weight: bold; font-size: 16px; }
        input { width: 100%; padding: 12px; border-radius: 8px; border: 2px solid #1f2a38; background: #1f2a38; color: white; font-size: 18px; outline: none; margin-bottom: 10px; box-sizing: border-box; }
        input:focus { border-color: var(--primary-orange); }
        .save-btn { width: 100%; padding: 12px; background: linear-gradient(45deg, var(--primary-blue), #258ad9); font-size: 16px; margin-bottom: 10px; }
        .undo-btn { width: 100%; padding: 10px; background: #555; color: white; font-size: 14px; }
        .undo-btn:hover { background: var(--error-color); }
        .section-title { color: var(--primary-orange); margin-top: 40px; margin-bottom: 20px; }
    </style>
</head>
<body>

    <div class="header">
        <h1>الإدخال اليومي والإدارة</h1>
        <button class="btn logout-btn" onclick="logout()">تسجيل الخروج</button>
    </div>

    <div id="status-message" style="text-align: center; margin-bottom: 20px;">جاري جلب البيانات...</div>

    <div class="meters-container" id="meters-container"></div>
    
    <h2 class="section-title">إدارة الأسعار (تُعدل عند الحاجة)</h2>
    <div class="settings-container" id="prices-container"></div>

    <script>
        if(localStorage.getItem('userRole') !== 'admin') window.location.href = 'index.html'; 

        const firebaseConfig = {
          apiKey: "AIzaSyBRCEBXzSNr6Pb2YGJlHcf70sM16QVAbhI",
          authDomain: "donea-d13db.firebaseapp.com",
          databaseURL: "https://donea-d13db-default-rtdb.firebaseio.com",
          projectId: "donea-d13db",
          storageBucket: "donea-d13db.firebasestorage.app",
          messagingSenderId: "797815045696",
          appId: "1:797815045696:web:f177acddbf214ca10569a5"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const statusMsg = document.getElementById('status-message');

        function initializeData() {
            db.ref('/').once('value').then((snapshot) => {
                statusMsg.style.display = 'none';
                const data = snapshot.val();
                if(data && data.meters && data.settings) {
                    renderMeters(data.meters, data.settings.fuel_types);
                    renderPrices(data.settings.fuel_types);
                }
            }).catch(err => {
                statusMsg.innerText = "خطأ في الاتصال بقاعدة البيانات.";
            });
        }

        // --- قسم العدادات والإدخال ---
        function renderMeters(meters, fuelTypes) {
            const container = document.getElementById('meters-container');
            container.innerHTML = ''; 
            for (const [meterId, meterData] of Object.entries(meters)) {
                const fuelType = fuelTypes[meterData.fuel_type_id];
                container.innerHTML += `
                    <div class="card">
                        <div class="card-title">${meterData.name}</div>
                        <div class="info-box">
                            المادة: <span>${fuelType.name}</span><br>
                            السعر: <span>${fuelType.current_price} ل.س</span><br>
                            القراءة السابقة: <span>${meterData.last_reading}</span>
                        </div>
                        <label>أدخل القراءة الجديدة:</label>
                        <input type="number" id="input-${meterId}">
                        <button class="btn save-btn" onclick="saveReading('${meterId}', '${meterData.fuel_type_id}', ${fuelType.current_price}, ${meterData.last_reading})">حفظ المبيعات</button>
                        <button class="btn undo-btn" onclick="undoLast('${meterId}', ${meterData.last_reading})">↩ تراجع عن آخر إدخال لليوم</button>
                    </div>
                `;
            }
        }

        function saveReading(meterId, fuelTypeId, price, lastReading) {
            const currentReading = parseFloat(document.getElementById(`input-${meterId}`).value);
            if (!currentReading || currentReading <= lastReading) {
                alert("❌ يرجى إدخال قراءة أكبر من القراءة السابقة."); return;
            }
            const soldQty = currentReading - lastReading;
            const totalAmount = soldQty * price;
            const today = new Date().toISOString().split('T')[0];
            const updates = {};
            const logId = db.ref().child(`daily_logs/${today}/${meterId}`).push().key; 
            updates[`daily_logs/${today}/${meterId}/${logId}`] = {
                start_reading: lastReading, end_reading: currentReading, quantity_sold: soldQty, price_at_sale: price, total_amount: totalAmount, timestamp: Date.now(), fuel_type_id: fuelTypeId
            };
            updates[`meters/${meterId}/last_reading`] = currentReading;
            db.ref().update(updates).then(() => {
                alert(`✅ تم حفظ المبيعات بنجاح!\nالكمية: ${soldQty} لتر\nالإجمالي: ${totalAmount} ل.س`);
                initializeData(); 
            });
        }

        // --- ميزة التراجع عن آخر إدخال (Undo) ---
        function undoLast(meterId, currentMeterReading) {
            if(!confirm("هل أنت متأكد من رغبتك في إلغاء آخر قراءة تم إدخالها اليوم لهذا العداد وإرجاعه للرقم السابق؟")) return;
            const today = new Date().toISOString().split('T')[0];
            
            db.ref(`daily_logs/${today}/${meterId}`).orderByKey().limitToLast(1).once('value').then(snapshot => {
                if(!snapshot.exists()) {
                    alert("لا يوجد مبيعات مسجلة لهذا العداد اليوم للتراجع عنها."); return;
                }
                snapshot.forEach(child => {
                    const logId = child.key;
                    const oldReading = child.val().start_reading;
                    const updates = {};
                    updates[`daily_logs/${today}/${meterId}/${logId}`] = null; // حذف الفاتورة
                    updates[`meters/${meterId}/last_reading`] = oldReading; // استعادة القراءة
                    
                    db.ref().update(updates).then(() => {
                        alert("✅ تم التراجع عن العملية بنجاح وإرجاع العداد للقراءة السابقة.");
                        initializeData();
                    });
                });
            });
        }

        // --- قسم إدارة الأسعار ---
        function renderPrices(fuelTypes) {
            const container = document.getElementById('prices-container');
            container.innerHTML = '';
            for (const [fuelId, fuelData] of Object.entries(fuelTypes)) {
                container.innerHTML += `
                    <div class="card">
                        <div class="card-title">${fuelData.name}</div>
                        <div class="info-box">السعر الحالي: <span>${fuelData.current_price} ل.س</span></div>
                        <input type="number" id="price-${fuelId}" placeholder="السعر الجديد">
                        <button class="btn save-btn" style="background:var(--primary-orange)" onclick="updatePrice('${fuelId}')">تحديث السعر</button>
                    </div>
                `;
            }
        }

        function updatePrice(fuelId) {
            const newPrice = parseFloat(document.getElementById(`price-${fuelId}`).value);
            if(!newPrice || newPrice <= 0) { alert("أدخل سعراً صحيحاً"); return; }
            db.ref(`settings/fuel_types/${fuelId}/current_price`).set(newPrice).then(() => {
                alert("✅ تم تحديث السعر بنجاح وسيطبق على المبيعات القادمة.");
                initializeData();
            });
        }

        function logout() { localStorage.removeItem('userRole'); window.location.href = 'index.html'; }
        
        initializeData();
    </script>
</body>
</html>
